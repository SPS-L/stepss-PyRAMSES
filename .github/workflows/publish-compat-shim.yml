name: Publish the pyramses tombstone

# By hand. Publishes the `pyramses` tombstone: the retired name, whose only
# job is to refuse installation and point at `stepss`. It tracks no `stepss`
# release, so it has no trigger tied to one. Bump `version=` in
# compat/pyramses/setup.py before every run, because PyPI files are immutable.
#
# Do not rename this file. The PyPI trusted publisher on the `pyramses`
# project binds to this filename alone, and renaming it breaks that binding.
# The name is stale (the distribution is a tombstone, not a shim) and stays
# that way for exactly that reason.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually upload to PyPI (leave off to rehearse)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # sdist ONLY, and PYRAMSES_BUILD_TOMBSTONE is what lets the build run at
      # all. The refusal lives in setup.py, which pip executes to prepare
      # metadata from an sdist and never executes for a wheel: publishing a
      # wheel would silently restore a working install of the retired name.
      # tools/test_compat_shim.sh asserts both halves.
      - name: Build the tombstone
        env:
          PYRAMSES_BUILD_TOMBSTONE: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist/ compat/pyramses
          ls -l dist/

      - name: Verify the tombstone refuses to install
        run: bash tools/test_compat_shim.sh

      - name: Refuse to upload a wheel
        run: |
          set -euo pipefail
          if compgen -G 'dist/*.whl' >/dev/null; then
            echo "FAIL: dist/ holds a wheel; a wheel installs without running setup.py"
            exit 1
          fi
          echo "OK: sdist only"

      # Read from github.event.inputs, which is a string, and compare against
      # the quoted literal. The `inputs` context would give a boolean here, and
      # an unquoted comparison coerces an unset value and fails *open*. Same
      # reasoning as the rehearsal guard in sync-upstream-release.yml.
      - name: Publish to PyPI
        if: github.event.inputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
