name: bundled-drift-check

# sync-upstream-release.yml serialises on the pyramses-sync concurrency
# group, which holds at most one pending run. If a second upstream release
# dispatches while a sync is still running, the queued run is superseded and
# cancelled *before it gets a runner* -- zero jobs execute -- so nothing
# inside that workflow ever has a chance to report the loss. A failed run,
# an expired RAMSES_READ_TOKEN, or an upstream that never dispatched at all
# are silent the same way. This workflow catches all of those causes at
# once, on a schedule, by comparing what master actually bundles against
# what each upstream has actually released, independent of how a sync might
# have been dropped.
#
# It also checks the other end of the pipeline. A sync cancelled after the
# fast-forward but before or during the PyPI upload leaves master matching
# upstream -- the bundled comparison reads clean -- while the version never
# reaches PyPI. Comparing master's __version__ against PyPI's latest is what
# makes that state visible instead of permanently silent.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Read the bundled versions
        id: bundled
        run: |
          BUNDLED="src/pyramses/_bundled.py"
          [ -f "$BUNDLED" ] || { echo "FAIL: not found: $BUNDLED"; exit 1; }
          # Same sed style tools/bump_version.sh's read_assign() uses.
          RAMSES="$(sed -n "s/^RAMSES_VERSION[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p" "$BUNDLED" | head -n1)"
          HELIOS="$(sed -n "s/^HELIOS_VERSION[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p" "$BUNDLED" | head -n1)"
          [ -n "$RAMSES" ] || { echo "FAIL: RAMSES_VERSION not found in $BUNDLED"; exit 1; }
          [ -n "$HELIOS" ] || { echo "FAIL: HELIOS_VERSION not found in $BUNDLED"; exit 1; }
          echo "ramses=$RAMSES" >> "$GITHUB_OUTPUT"
          echo "helios=$HELIOS" >> "$GITHUB_OUTPUT"
          echo "Bundled: ramses=$RAMSES helios=$HELIOS"

      - name: Compare against upstream latest
        id: compare
        env:
          GH_TOKEN: ${{ secrets.RAMSES_READ_TOKEN }}
          RAMSES_BUNDLED: ${{ steps.bundled.outputs.ramses }}
          HELIOS_BUNDLED: ${{ steps.bundled.outputs.helios }}
        run: |
          set -euo pipefail
          # `gh release list ... -q '.[].tagName'` prints nothing both when
          # the call fails AND when a repo genuinely has zero non-prerelease
          # releases. Neither case may silently compare as "" != bundled, so
          # both a non-zero exit (caught by set -e, since a bare `x=$(cmd)`
          # assignment propagates the command's exit status) and an empty
          # result are treated as a hard failure here.
          latest_release() {
            local repo="$1" tag
            tag="$(gh release list --repo "$repo" --exclude-pre-releases --limit 1 --json tagName -q '.[].tagName')"
            if [ -z "$tag" ]; then
              echo "FAIL: no non-prerelease release found for $repo (or the API call returned nothing)" >&2
              exit 1
            fi
            printf '%s' "$tag"
          }

          RAMSES_LATEST="$(latest_release SPS-L/stepss-ramses)"
          HELIOS_LATEST="$(latest_release SPS-L/stepss-helios)"

          echo "ramses: bundled=$RAMSES_BUNDLED latest=$RAMSES_LATEST"
          echo "helios: bundled=$HELIOS_BUNDLED latest=$HELIOS_LATEST"

          DRIFT=false
          [ "$RAMSES_BUNDLED" = "$RAMSES_LATEST" ] || DRIFT=true
          [ "$HELIOS_BUNDLED" = "$HELIOS_LATEST" ] || DRIFT=true

          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          echo "ramses_latest=$RAMSES_LATEST" >> "$GITHUB_OUTPUT"
          echo "helios_latest=$HELIOS_LATEST" >> "$GITHUB_OUTPUT"

          if [ "$DRIFT" = "false" ]; then
            echo "OK: bundled versions match each upstream's latest non-prerelease release"
          fi

      # The bundled comparison above says nothing about whether the version
      # master ships was ever published. Cancel a sync run between the
      # fast-forward and the PyPI upload and master is perfectly in step with
      # upstream while PyPI is a release behind, forever, with nothing
      # reporting it. This is the backstop for that.
      - name: Compare master's version against PyPI
        id: pypi
        run: |
          set -euo pipefail
          INIT="src/pyramses/__init__.py"
          [ -f "$INIT" ] || { echo "FAIL: not found: $INIT"; exit 1; }
          # Same sed style tools/bump_version.sh's read_assign() uses.
          REPO_VERSION="$(sed -n "s/^__version__[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p" "$INIT" | head -n1)"
          [ -n "$REPO_VERSION" ] || { echo "FAIL: __version__ not found in $INIT"; exit 1; }

          # An unreachable or misbehaving PyPI must never read as "no drift",
          # which is the whole failure mode this step exists to prevent. `curl
          # -f` turns an HTTP error status into a non-zero exit, and every
          # unexpected shape below is an explicit hard failure, so the run goes
          # red rather than quietly reporting OK.
          if ! curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
                 -o pypi.json https://pypi.org/pypi/pyramses/json; then
            echo "FAIL: could not query https://pypi.org/pypi/pyramses/json"
            exit 1
          fi
          PYPI_VERSION="$(jq -r '.info.version // empty' pypi.json)"
          [ -n "$PYPI_VERSION" ] || { echo "FAIL: no .info.version in the PyPI response"; exit 1; }

          echo "pyramses: master=$REPO_VERSION pypi=$PYPI_VERSION"

          # Numeric major.minor.patch compare. bump_version.sh enforces exactly
          # that shape, so anything else is a corrupted state, not a version to
          # guess at.
          REL="$(python3 - "$REPO_VERSION" "$PYPI_VERSION" <<'PYEOF'
          import sys

          def parse(label, value):
              parts = value.split('.')
              if len(parts) != 3 or not all(p.isdigit() for p in parts):
                  sys.exit('FAIL: %s version %r is not major.minor.patch with numeric parts'
                           % (label, value))
              return tuple(int(p) for p in parts)

          repo = parse('master', sys.argv[1])
          pypi = parse('PyPI', sys.argv[2])
          print('ahead' if repo > pypi else 'level' if repo == pypi else 'behind')
          PYEOF
          )"

          # Only "master ahead" is the missing-upload signal. PyPI ahead of
          # master is not something this automation can produce and is a
          # different problem; it is reported in the log but not as drift.
          DRIFT=false
          case "$REL" in
            ahead)
              DRIFT=true
              echo "DRIFT: master ships $REPO_VERSION but PyPI's latest is $PYPI_VERSION"
              ;;
            level)
              echo "OK: PyPI is level with master at $PYPI_VERSION"
              ;;
            behind)
              echo "WARN: PyPI ($PYPI_VERSION) is ahead of master ($REPO_VERSION), which this automation cannot produce"
              ;;
          esac

          echo "drift=$DRIFT"                 >> "$GITHUB_OUTPUT"
          echo "repo_version=$REPO_VERSION"   >> "$GITHUB_OUTPUT"
          echo "pypi_version=$PYPI_VERSION"   >> "$GITHUB_OUTPUT"

      - name: File or update a drift issue
        if: steps.compare.outputs.drift == 'true' || steps.pypi.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMSES_BUNDLED: ${{ steps.bundled.outputs.ramses }}
          HELIOS_BUNDLED: ${{ steps.bundled.outputs.helios }}
          RAMSES_LATEST: ${{ steps.compare.outputs.ramses_latest }}
          HELIOS_LATEST: ${{ steps.compare.outputs.helios_latest }}
          PYPI_DRIFT: ${{ steps.pypi.outputs.drift }}
          REPO_VERSION: ${{ steps.pypi.outputs.repo_version }}
          PYPI_VERSION: ${{ steps.pypi.outputs.pypi_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One title for both kinds of drift, so a repo that is simultaneously
          # behind upstream and ahead of PyPI collects both reports on one
          # issue rather than opening two.
          TITLE="Release drift: bundled libraries or PyPI"

          # Every heredoc below, content and terminator alike, sits at this
          # run: block's own YAML indentation and no deeper (as the
          # sync-ramses-release.yml workflow in stepss-uramses does with its
          # <<-EOF heredocs): YAML strips exactly the block's base
          # indentation from every physical line before bash ever sees it,
          # so keeping these flush with that column is what lands the
          # content flush left in the actual issue body, with no accidental
          # 4-space indented-code-block markdown, and lets a plain
          # (non-dashed) heredoc terminator match.
          BODY="$(cat <<EOF
          This is filed by \`bundled-drift-check\`, which runs on a daily
          schedule. A sync run superseded while queued in the
          \`pyramses-sync\` concurrency group is cancelled with **zero jobs
          run**, so nothing inside \`sync-upstream-release.yml\` itself can
          ever report that loss. This check instead compares two things against
          the outside world, which catches a dropped sync regardless of cause:
          concurrency supersession, a failed run, an expired token, an upstream
          that never dispatched, or a run cancelled part-way through.

          1. what \`master\` currently bundles, against each upstream's latest
             non-prerelease release;
          2. the version \`master\` ships, against the latest version on PyPI.

          Run: $RUN_URL
          EOF
          )"

          if [ "$RAMSES_BUNDLED" != "$RAMSES_LATEST" ]; then
          BODY="$BODY

          $(cat <<EOF
          - **ramses**: bundled \`$RAMSES_BUNDLED\`, upstream latest \`$RAMSES_LATEST\`

            Recover with:
            \`\`\`
            gh api /repos/SPS-L/stepss-pyramses/dispatches \\
              -f event_type=ramses-release \\
              -f "client_payload[tag]=$RAMSES_LATEST"
            \`\`\`
          EOF
          )"
          fi

          if [ "$HELIOS_BUNDLED" != "$HELIOS_LATEST" ]; then
          BODY="$BODY

          $(cat <<EOF
          - **helios**: bundled \`$HELIOS_BUNDLED\`, upstream latest \`$HELIOS_LATEST\`

            Recover with:
            \`\`\`
            gh api /repos/SPS-L/stepss-pyramses/dispatches \\
              -f event_type=helios-release \\
              -f "client_payload[tag]=$HELIOS_LATEST"
            \`\`\`
          EOF
          )"
          fi

          if [ "$PYPI_DRIFT" = "true" ]; then
          BODY="$BODY

          $(cat <<EOF
          - **PyPI**: \`master\` ships \`$REPO_VERSION\`, PyPI's latest is \`$PYPI_VERSION\`

            A sync run cancelled (by hand, or by a job timeout) after the
            fast-forward but before or during the PyPI upload leaves exactly
            this state: \`master\` moved, the GitHub release exists with the
            gated wheel attached, and nothing was published.

            Check https://pypi.org/project/pyramses/#history first, in case the
            upload did complete and only the reporting was lost. If \`$REPO_VERSION\`
            really is absent, upload the wheel already attached to the
            \`v$REPO_VERSION\` release -- do not rebuild:
            \`\`\`
            gh workflow run python-publish.yml \\
              --repo SPS-L/stepss-pyramses \\
              -f tag=v$REPO_VERSION
            \`\`\`
          EOF
          )"
          fi

          # `in:title` search is word-based, not exact, so a search for one
          # drifted tag could match an open issue titled for a different
          # drift. Fetch titles and compare exactly instead (same style as
          # stepss-uramses' sync-ramses-release.yml report-failure job).
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            if ! gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "$TITLE" --body "$BODY" --label ci; then
              echo "WARN: creating the issue with the 'ci' label failed (it may not exist yet); filing without a label"
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --body "$BODY"
            fi
            echo "Opened a new issue"
          fi
