name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # Same images and the same interpreters the release gate pins, so an
        # ordinary PR fails here rather than during a release. The interpreters
        # were not always in step, and v3.81.1 is what that cost: the gate ran
        # 3.12 alone, so a wheel that fails on 3.10 was published and this
        # workflow went red on the same commit minutes afterwards.
        os: [ubuntu-24.04, windows-latest, macos-15]
        python-version: ['3.10', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The bundled ramses.so is dynamically linked against OpenBLAS and the
      # GCC/gfortran runtimes, which the hosted runners don't have preinstalled.
      # Windows is exempt: that RAMSES build is statically linked and self-contained.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas0 libgfortran5 libgomp1

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas gcc

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./src pytest

      - name: Run tests
        run: pytest tests/ -v
